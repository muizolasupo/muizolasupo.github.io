# Fetches a free-licensed photo (for example from Unsplash) onto GitHub's servers,
# saves a sharp web master copy (long side 2400 px, high-quality JPEG) under
# images/articles/, and commits it. Run by hand from the Actions tab or with
#   gh workflow run fetch-photo.yml -f url=<photo download URL> -f name=<file stem>
# The site's article pages then use responsive copies made from this master.
name: Fetch article photo

on:
  workflow_dispatch:
    inputs:
      url:
        description: "Direct download URL of the photo (e.g. https://unsplash.com/photos/<id>/download?force=true)"
        required: true
      name:
        description: "File name stem to save as, e.g. mile12-market"
        required: true

permissions:
  contents: write             # needed to commit the photo

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Download the photo
        env:
          URL: ${{ inputs.url }}
        run: |
          curl -fsSL --retry 3 -A "Mozilla/5.0 (muizolasupo.com photo fetch)" "$URL" -o /tmp/original
          file /tmp/original
          ls -la /tmp/original

      - name: Save a web master copy (long side 2400 px)
        env:
          NAME: ${{ inputs.name }}
        run: |
          python -m pip install --quiet pillow==11.0.0
          python - <<'EOF'
          # Convert to sRGB JPEG, keep the original aspect ratio, cap the long side
          # at 2400 px with Lanczos resampling, and save a progressive high-quality JPEG.
          import os, re
          from PIL import Image, ImageOps
          name = re.sub(r'[^a-z0-9-]', '', os.environ['NAME'].lower())
          im = ImageOps.exif_transpose(Image.open('/tmp/original')).convert('RGB')
          print('original size', im.size)
          im.thumbnail((2400, 2400), Image.LANCZOS)
          os.makedirs('images/articles', exist_ok=True)
          out = f'images/articles/{name}-master.jpg'
          im.save(out, 'JPEG', quality=88, optimize=True, progressive=True)
          print('saved', out, im.size, os.path.getsize(out), 'bytes')
          EOF

      - name: Commit the photo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add images/articles/
          git commit -m "Add article photo master: ${{ inputs.name }}" || exit 0
          git pull --rebase
          git push
