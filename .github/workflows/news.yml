# Refreshes the "Economy & markets" headlines on the Home page.
# Runs scripts/update_news.py every three hours (and on demand, or when the
# script itself changes) and commits news.json only when the headlines change.
# Each such commit redeploys GitHub Pages, so the site shows the new headlines.
name: Update news headlines

on:
  schedule:
    - cron: "23 */3 * * *"   # minute 23 of every third hour (UTC), off the busy top of the hour
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/update_news.py
      - .github/workflows/news.yml

permissions:
  contents: write             # needed to commit news.json

concurrency:
  group: news-headlines       # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed parser
        run: python -m pip install --quiet feedparser==6.0.11

      - name: Fetch headlines
        run: python scripts/update_news.py

      - name: Commit news.json if the headlines changed
        run: |
          if git diff --quiet -- news.json && git ls-files --error-unmatch news.json >/dev/null 2>&1; then
            echo "Headlines unchanged; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add news.json
          git commit -m "Update news headlines"
          # Rebase onto any commit pushed while this job ran, then push.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
