# Refreshes the Home page "Economy & markets" section: headlines (news.json,
# scripts/update_news.py), economic signals (signals.json, scripts/update_signals.py)
# and U.S./NGX stock prices for the bubble maps (markets.json, scripts/update_markets.py). Runs every three hours, on demand, and when either
# script changes; commits only files whose content changed. Each commit
# redeploys GitHub Pages, so the site shows the new data.
name: Update news headlines

on:
  schedule:
    - cron: "23 */3 * * *"   # minute 23 of every third hour (UTC), off the busy top of the hour
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  push:
    branches: [main]
    paths:
      - scripts/update_news.py
      - scripts/update_signals.py
      - scripts/update_markets.py
      - .github/workflows/news.yml

permissions:
  contents: write             # needed to commit news.json

concurrency:
  group: news-headlines       # never run two updates at once
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install feed parser
        run: python -m pip install --quiet feedparser==6.0.11

      - name: Fetch headlines
        run: python scripts/update_news.py
        continue-on-error: true   # a failure here must not block the signals update

      - name: Fetch economic signals
        run: python scripts/update_signals.py
        continue-on-error: true

      - name: Fetch stock market data (U.S. and NGX)
        run: python scripts/update_markets.py
        continue-on-error: true

      - name: Commit data files that changed
        run: |
          for f in news.json signals.json markets.json; do [ -f "$f" ] && git add "$f"; done
          if git diff --cached --quiet; then
            echo "No data changed; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update headlines and economic signals"
          # Rebase onto any commit pushed while this job ran, then push.
          git pull --rebase --quiet origin main
          git push origin HEAD:main
